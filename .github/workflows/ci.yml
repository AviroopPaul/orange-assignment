name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
        working-directory: server
      - run: ./scripts/check.sh
        working-directory: server

  web:
    name: Web types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL, Redis and real worker processes, in Compose. No model key: the model is scripted.
      - run: make test-integration
      - name: Show service logs after a failure
        if: failure()
        run: docker compose --profile test logs --tail=100 postgres redis

  evals:
    name: Evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Every scenario on its own stack, on a network with no route out. The exit code is the result.
      - run: make evals
      - name: Keep the table and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results.*
            evals/logs/

  clean-start:
    name: Clean start and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # N19: from nothing, with no key. `make up` waits until every health check passes.
      - run: make up
      - run: curl --fail --silent --show-error http://localhost:8000/readyz
      - run: curl --fail --silent --show-error --output /dev/null http://localhost:3000
      # N20: the repo, the ignore files and the built image.
      - run: python3 server/scripts/scan_secrets.py --image errand-agent-server
      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --tail=100
